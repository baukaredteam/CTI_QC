  - rule_id: "INC_0002400"
    rule_name: "Using_REG_to_Dump_Sensitive_Registry_Hives_Windows"
    enabled: true
    created_date: "2020-09-24"
    modified_date: "2023-03-30"
    event_count_30d: 0
    offense_count_30d: 0
    log_source: "Microsoft Windows Security Event Log"
    criticality: "Medium"
    mitre_techniques: ["T1003.002"]
    sysmon_required: true

    full_rule_logic: |
      Apply INC_0002400_common:Using_REG_to_Dump_Sensitive_Registry_Hives_Windows
      on events which are detected by the Local system
      AND when an event matches BB_0002400_common:Using_REG_to_Dump_Sensitive_Registry_Hives_Windows

    building_blocks:
      - bb_id: "BB_0002400"
        bb_name: "Using_REG_to_Dump_Sensitive_Registry_Hives_Windows"
        level: 1
        depends_on_bb:
          - "BB_common:Reg_Tool_Windows"
          - "BB_eventtype:Cmdline"
        own_conditions: |
          cmdline IMATCHES '.*\ssave\s.*'
          AND (cmdline IMATCHES '.*\\sam.*'
               OR cmdline IMATCHES '.*\\security.*'
               OR cmdline IMATCHES '.*\\system[^32].*')
        full_bb_logic: |
          Apply BB_0002400_common:Using_REG_to_Dump_Sensitive_Registry_Hives_Windows
          on events which are detected by the Local system
          AND when event matches BB_common:Reg_Tool_Windows
          AND when event matches BB_eventtype:Cmdline
          AND when cmdline IMATCHES '.*\ssave\s.*'
          AND when (cmdline IMATCHES '.*\\sam.*' OR cmdline IMATCHES '.*\\security.*' OR cmdline IMATCHES '.*\\system[^32].*')

      - bb_id: "BB_common:Reg_Tool_Windows"
        bb_name: "Reg_Tool_Windows"
        level: 2
        depends_on_bb:
          - "BB_eventtype:ProcessCreate"
        own_conditions: |
          proc_file_path IMATCHES '.*\\reg\.exe'
          OR proc_file_originalfilename IMATCHES 'reg\.exe'
        full_bb_logic: |
          Apply BB_common:Reg_Tool_Windows
          on events which are detected by the Local system
          AND when event matches BB_eventtype:ProcessCreate
          AND when (proc_file_path IMATCHES '.*\\reg\.exe' OR proc_file_originalfilename IMATCHES 'reg\.exe')

      - bb_id: "BB_eventtype:Cmdline"
        bb_name: "Cmdline"
        level: 2
        depends_on_bb:
          - "BB_logsource:Windows_to_refactor"
        own_conditions: |
          event_id = 4688
          AND CommandLine IS NOT NULL
        full_bb_logic: |
          Apply BB_eventtype:Cmdline
          on events which are detected by the Local system
          AND when event matches BB_logsource:Windows_to_refactor
          AND when event_id = 4688
          AND when CommandLine IS NOT NULL

    effective_detection_logic: |
      Log Source Type = Microsoft Windows Security Event Log
      AND event_id = 4688
      AND proc_file_path IMATCHES '.*\\reg\.exe'
      AND cmdline IMATCHES '.*\ssave\s.*'
      AND cmdline IMATCHES '.*(\\sam|\\security|\\system).*'
      [OR Sysmon EventID 1 with same conditions]

    bb_chain_summary: |
      INC_0002400
        └─ BB_0002400 (Level 1)
             ├─ own: reg save + sam/security/system
             ├─ BB_common:Reg_Tool_Windows (Level 2)
             │    └─ reg.exe
             └─ BB_eventtype:Cmdline (Level 2)
                  └─ event_id = 4688 + CommandLine IS NOT NULL

    custom_fields:
      - name: "proc_file_path"
