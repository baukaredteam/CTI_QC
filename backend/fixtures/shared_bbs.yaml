# =============================================================
# УРОВЕНЬ 2 — Tool/Process BB (adversary-controlled)
# =============================================================

  - bb_id: "BB_common:Regsvr32_Tool_Windows"
    bb_name: "Regsvr32_Tool_Windows"
    level: 2
    category: "tool_detection"
    depends_on_bb:
      - "BB_logsource:Windows_to_refactor"
    own_conditions: |
      proc_file_path IMATCHES '.*\\regsvr32\.exe'
    full_bb_logic: |
      Apply BB_common:Regsvr32_Tool_Windows
      on events which are detected by the Local system
      AND when event matches BB: Log source type - Windows_to_refactor
      AND when "proc_file_path" IMATCHES '.*\\regsvr32\.exe' AQL filter query
    adversary_control: "HIGH"
    availability: "full"
    notes: |
      proc_file_path = ProcessName. Adversary-controlled — HIGH.
      Бинарник можно переименовать.
      Chokepoint: COM server registration через LoadLibrary — нельзя обойти.

