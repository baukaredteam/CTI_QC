# =============================================================
# shared_bbs.yaml
# Общие Building Blocks — загружаются один раз для всех правил
# Агент читает этот файл ПЕРВЫМ перед анализом windows_rules.yaml
# =============================================================

metadata:
  description: "Shared Building Blocks for QRadar rules — Windows log source"
  log_source_family: "Microsoft Windows Security Event Log"
  last_updated: "2026-07-11"
  total_shared_bbs: 85
  usage: |
    В rules/*.yaml ссылайся на BB по bb_id.
    Агент резолвит зависимости автоматически через depends_on_bb.

# =============================================================
# УРОВЕНЬ 3 — Log Source фильтры (базовые, без зависимостей)
# =============================================================
shared_building_blocks:

  - bb_id: "BB_logsource:Windows_to_refactor"
    bb_name: "Log source type - Windows_to_refactor"
    level: 3
    category: "log_source_filter"
    depends_on_bb: []
    own_conditions: |
      Log Source Type = Microsoft Windows Security Event Log
    full_bb_logic: |
      Apply BB: Log source type - Windows_to_refactor
      on events which are detected by the Local system
      AND when the Log Source type is Microsoft Windows Security Event Log
    notes: "Базовый фильтр по типу источника. Используется как первый BB в большинстве Windows правил."

  - bb_id: "BB_logsource:Sysmon"
    bb_name: "Log source type - Sysmon"
    level: 3
    category: "log_source_filter"
    depends_on_bb: []
    own_conditions: |
      Log Source Type = Sysmon
    full_bb_logic: |
      Apply BB: Log source type - Sysmon
      on events which are detected by the Local system
      AND when the Log Source type is Sysmon
    notes: "⚠ Требует установленного Sysmon. Если не установлен — правило слепое."

# =============================================================
# УРОВЕНЬ 2 — Event Type фильтры (зависят от Log Source BB)
# =============================================================

  - bb_id: "BB_eventtype:ProcessCreate"
    bb_name: "ProcessCreate"
    level: 2
    category: "event_type_filter"
    depends_on_bb:
      - "BB_logsource:Windows_to_refactor"
    own_conditions: |
      event_id (custom) is any of 4688
    full_bb_logic: |
      Apply BB_eventtype:ProcessCreate
      on events which are detected by the Local system
      AND when event matches BB: Log source type - Windows_to_refactor
      AND when the event matches event_id (custom) is any of 4688
    adversary_control: "LOW"
    notes: "EventID 4688 — Process Creation. Chokepoint для process-based детекций."

  - bb_id: "BB_eventtype:ProcessCreate_Sysmon"
    bb_name: "ProcessCreate_Sysmon"
    level: 2
    category: "event_type_filter"
    sysmon_required: true
    depends_on_bb:
      - "BB_logsource:Sysmon"
    own_conditions: |
      event_id (custom) is any of 1
    full_bb_logic: |
      Apply BB_eventtype:ProcessCreate_Sysmon
      on events which are detected by the Local system
      AND when event matches BB: Log source type - Sysmon
      AND when the event matches event_id (custom) is any of 1
    adversary_control: "LOW"
    notes: "Sysmon EventID 1. Даёт ParentProcess и CommandLine надёжнее чем 4688."

  - bb_id: "BB_eventtype:Cmdline"
    bb_name: "Cmdline"
    level: 2
    category: "event_type_filter"
    depends_on_bb:
      - "BB_logsource:Windows_to_refactor"
    own_conditions: |
      event_id (custom) is any of 4688
      AND CommandLine IS NOT NULL
    full_bb_logic: |
      Apply BB_eventtype:Cmdline
      on events which are detected by the Local system
      AND when event matches BB: Log source type - Windows_to_refactor
      AND when the event matches event_id (custom) is any of 4688
      AND when CommandLine IS NOT NULL AQL filter query
    adversary_control: "HIGH"
    availability: "partial"
    notes: |
      ⚠ CommandLine доступен только если включён GPO:
      Computer Configuration → Policies → Audit Process Creation →
      'Include command line in process creation events'
      Без GPO — поле пустое, BB слепой.

